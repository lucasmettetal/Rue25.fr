name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Le front (Cloudflare) et l'API (Railway) sont sur deux domaines distincts :
# l'URL de l'API doit être compilée dans le bundle. Ce n'est pas un secret.
# Surchargeable sans toucher au code par une variable de dépôt VITE_API_URL
# (Settings → Secrets and variables → Actions → Variables).
env:
  VITE_API_URL: ${{ vars.VITE_API_URL || 'https://rue25fr-production.up.railway.app/api' }}

jobs:
  backend:
    name: Backend — lint & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test
        env:
          JWT_SECRET: ci_jwt_secret_min_32_chars_placeholder
          STRIPE_SECRET_KEY: sk_test_ci_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

  frontend:
    name: Frontend — lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # Le Worker était jusqu'ici mis à jour à la main : merger sur `main` ne mettait
  # rien en ligne. Ce job s'en charge, et seulement si le lint et les tests
  # passent — on ne déploie jamais une version cassée.
  deploy-frontend:
    name: Frontend — déploiement Cloudflare
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-frontend
      cancel-in-progress: true
    defaults:
      run:
        working-directory: frontend
    # Le contexte `secrets` n'est pas lisible depuis le `if` d'une étape ; il
    # l'est en revanche ici. On recopie donc les deux valeurs pour pouvoir
    # tester leur présence plus bas.
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Reconstruit ici plutôt que de transporter le dossier dist entre deux jobs :
      # `npm run build` interroge l'API pour générer le sitemap et les aperçus de
      # partage, autant qu'ils reflètent le catalogue au moment du déploiement.
      - name: Build
        run: npm run build

      # Tant que les deux secrets ne sont pas posés sur le dépôt, on saute le
      # déploiement au lieu de faire échouer la CI : le reste du pipeline garde
      # son sens, et le message ci-dessous dit quoi faire.
      - name: Deploy
        if: ${{ env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          command: deploy

      - name: Secrets Cloudflare manquants
        if: ${{ env.CF_API_TOKEN == '' || env.CF_ACCOUNT_ID == '' }}
        run: |
          echo "::warning title=Déploiement sauté::CLOUDFLARE_API_TOKEN et/ou CLOUDFLARE_ACCOUNT_ID ne sont pas définis."
          echo "À créer dans Settings > Secrets and variables > Actions. Voir la section Déploiement du README."
